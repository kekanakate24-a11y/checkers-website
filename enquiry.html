<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers | Customer Enquiry & Support</title>
</head>
<body>

    <header>
        <img src="images/checkers-logo.png" alt="Checkers Logo" width="150">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products & Deals</a></li>
                <li><a href="enquiry.html">Sixty60 Enquiry</a></li>
                <li><a href="contact.html">Store Locator</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="enquiry-section">
            <h2>Customer Enquiry Form</h2>
            <p>Please submit your query regarding Xtra Savings, Sixty60 deliveries, or general store feedback.</p>

            <form action="#" method="post">
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="category">Enquiry Category:</label><br>
                <select id="category" name="category">
                    <option value="sixty60">Sixty60 Order Query</option>
                    <option value="xtra_savings">Xtra Savings Card Support</option>
                    <option value="product">Product Feedback</option>
                    <option value="general">General Enquiry</option>
                </select><br><br>

                <label for="message">Your Message:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Checkers South Africa. All rights reserved.</p>
    </footer>

</body>
</html>
